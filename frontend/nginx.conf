# ---------------------------------------------------------------------------
# IMPORTANT — Pourquoi le site ne change pas après `npm run build` ?
#
# Ce fichier est utilisé DANS l’image Docker frontend (root = /usr/share/nginx/html).
# Un build lancé sur l’hôte dans /var/www/crm/frontend met les fichiers dans
# frontend/dist/ UNIQUEMENT. Tant que vous ne :
#   - reconstruisez pas l’image Docker frontend, OU
#   - ne copiez pas dist/ vers le répertoire réellement servi par Nginx,
# ktoptima.com continuera d’afficher l’ancienne version.
#
# À la racine du dépôt :
#   MODE=docker ./scripts/deploy-frontend.sh
# ou (Nginx sans Docker, root = DEPLOY_ROOT) :
#   MODE=static DEPLOY_ROOT=/chemin/vers/html sudo ./scripts/deploy-frontend.sh
# ---------------------------------------------------------------------------
#
# Si Nginx termine les requêtes /api/ sans les transmettre à Node, ou si proxy_pass
# enlève le préfixe /api (ex. proxy_pass http://127.0.0.1:4000/ ;), Express ne reçoit
# pas /api/prospecting/... → 404. Utiliser par ex. :
#
#   location /api/ {
#     proxy_pass http://127.0.0.1:4000/api/;
#     proxy_http_version 1.1;
#     proxy_set_header Host $host;
#     proxy_set_header X-Real-IP $remote_addr;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto $scheme;
#   }
#
# Puis : git pull + cd backend && npm ci && npm run build && npx prisma migrate deploy && pm2 restart …

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA : toutes les routes renvoient vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache aggressif pour les assets (avec hash dans le nom)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Pas de cache pour index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Service worker : toujours reprendre la dernière version après déploiement
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;
}
